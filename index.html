<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#066ac9">
  <link rel="manifest" href="/site.webmanifest">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
  <title>Devangwa Coaching | Relationship & Marriage Programmes</title>

  <style>
    #splash-screen {
      position: fixed;
      top: 50%;
      left: 50%;
      background: linear-gradient(180deg, #f8fafc 0%, #eef2f7 100%);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      height: 100%;
      width: 100%;
      transform: translate(-50%, -50%);
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: all 15s linear;
      overflow: hidden;
    }

    #splash-screen .splash-mark {
      width: 88px;
      height: 88px;
    }

    #splash-screen .splash-logo {
      height: 56px;
      width: auto;
      max-width: min(340px, 85vw);
    }

    #splash-screen.remove {
      animation: fadeout 0.7s forwards;
      z-index: 0;
    }

    @keyframes fadeout {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div id="splash-screen">
    <img alt="" class="splash-mark" src="/favicon.svg" aria-hidden="true" />
    <img alt="Devangwa Coaching" class="splash-logo light" src="/splash-logo.svg" />
  </div>
  <script type="module" src="/src/main.js"></script>
  <script>
    const appEl = document.querySelector('#app');
    new MutationObserver(() => {
      document.querySelector('#splash-screen')?.classList.add('remove');
    }).observe(appEl, { childList: true })
  </script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sticky-js/1.3.0/sticky.min.js"
    integrity="sha512-3z3zGiu0PabNyuTAAfznBJFpOg4owG9oQQasE5BwiiH5BBwrAjbfgIe0RCdtHJ0BQV1YF2Shgokbz2NziLnkuQ=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
